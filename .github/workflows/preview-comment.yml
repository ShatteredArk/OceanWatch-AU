name: Preview URL comment

on:
  deployment_status:

jobs:
  comment:
    name: Post Vercel preview URL
    runs-on: ubuntu-latest
    # Only run when a Vercel preview deployment is ready
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'

    permissions:
      pull-requests: write

    steps:
      - name: Find associated PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            const pr = prs.find(p => p.state === 'open');
            return pr ? pr.number : null;

      - name: Comment preview URL
        if: steps.find-pr.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.find-pr.outputs.result }};
            const url = context.payload.deployment_status.target_url;
            const env = context.payload.deployment.environment;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### Vercel Preview\n\n✅ **${env}** is ready: ${url}`,
            });
